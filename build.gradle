plugins { id 'com.android.application' }
android {
    namespace 'com.simpletv.launcher'
    compileSdk 34
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.simpletv.launcher'
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('vCode') ?: '1') as int)
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

      - name: Usar index.html do repositorio, se existir
        run: if [ -f index.html ]; then cp index.html /tmp/p/app/src/main/assets/index.html; fi
      - name: Compilar
        run: cd /tmp/p && gradle --no-daemon assembleDebug

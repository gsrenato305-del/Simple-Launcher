name: Build Simple TV
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Abrir projeto
        run: |
          unzip -q SimpleTV-launcher.zip -d /tmp/x
          cp -r /tmp/x/SimpleTV /tmp/p
      - name: Usar index.html do repositorio
        run: if [ -f index.html ]; then cp index.html /tmp/p/app/src/main/assets/index.html; fi
      - name: Chave TMDB (opcional)
        run: echo "window.TMDB_KEY='${{ secrets.TMDB_KEY }}';" > /tmp/p/app/src/main/assets/config.js
      - name: Compilar
        run: cd /tmp/p && gradle --no-daemon assembleDebug -PvCode=${{ github.run_number }}
      - name: Preparar APK
        run: cp /tmp/p/app/build/outputs/apk/debug/app-debug.apk SimpleTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Simple TV v${{ github.run_number }}
          files: SimpleTV.apk
